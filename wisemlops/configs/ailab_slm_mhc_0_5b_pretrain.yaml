## ============ launch args for platform adaptor ============
entry: pretrain_gpt.py
model_name: ailab_slm_mhc
load_name: ""
load_iter: ""
dataset_name: ""
data_prefixes_and_weights: []  ## per-run data mix; passed by the job shell
tokenizer_tag: ailab_slm      ## selects ml_data__<tokenizer_tag>[_<seq-length>[_pack]]
is_pretrain_data: true
is_pack_varlen_data: false

huashan_obs_mtp_task: ""
huashan_obs_ml_data: ""

mount_dataset_mtp_task: ""
mount_dataset_ml_data: ""

copy_data_to_cache: false

enable_tensorboard: true
enable_swanlab: false

sync_ckpt:
  enable: true
  interval: 60
  # src: <defaults to save>
  # dst: <defaults to computed obs save dir>

mcore2hf_after_training:
  iters: []      ## empty until CONVERTERS gains ailab_slm_mhc + hc param mapping in convert_ckpt_v2.py

## ============ mindspeed-llm training args ============
## keys are the literal CLI flags (dashes); render emits `--<key>` with no translation.
## ---- mhc ----
enable-mhc: true
hc-mult: 4
use-fused-mhc: true
hc-sinkhorn-iters: 20
spec: [mindspeed_llm.tasks.models.spec.gpt_mhc_spec, layer_spec]

## ---- optimizer ----
optimizer: muon-legacy
muon-legacy-matched-adamw-rms: 0.2

## ---- context parallel ----
context-parallel-size: 1
context-parallel-algo: ulysses_cp_algo
attention-mask-type: causal
transformer-impl: local

## ---- parallelism ----
tensor-model-parallel-size: 1
sequence-parallel: true
pipeline-model-parallel-size: 1

## ---- tokenizer / mcore ----
tokenizer-not-use-fast: true
use-mcore-models: true
tokenizer-type: PretrainedFromHF
tokenizer-name-or-path: ""    ## computed by pre-tasks

## ---- seq / batch ----
seq-length: 4096
max-position-embeddings: ${seq-length}
micro-batch-size: 2
global-batch-size: 1024

## ---- arch (ailab_slm_0_5b) ----
group-query-attention: true
num-query-groups: 4
num-attention-heads: 16
kv-channels: 128
num-layers: 28
hidden-size: 1024
ffn-hidden-size: 4096
scale-emb: 32
swiglu: true
use-fused-swiglu: true
disable-bias-linear: true
position-embedding-type: rope
use-rotary-position-embeddings: true
rotary-base: 100000
normalization: RMSNorm
norm-epsilon: "1e-05"
use-fused-rmsnorm: true
attention-dropout: 0.0
hidden-dropout: 0.0
make-vocab-size-divisible-by: 1
padded-vocab-size: 64512

## ---- train schedule ----
train-iters: 25000
lr: "2e-3"
min-lr: "5e-5"
lr-warmup-fraction: 0.01
lr-decay-style: cosine
init-method-std: 0.02
use-flash-attn: true
no-masked-softmax-fusion: true
attention-softmax-in-fp32: true
weight-decay: 0.1
clip-grad: 1.0
adam-beta1: 0.9
adam-beta2: 0.95
no-gradient-accumulation-fusion: true
no-load-optim: true
no-load-rng: true
seed: 3668
bf16: true

## ---- data / output (paths computed by pre-tasks; empty here) ----
data-path: []                ## computed: get_data_path(...)
split: "100,0,0"
log-interval: 1
save-interval: 2000
no-save-optim: true
ckpt-format: torch            ## v2 mcore2hf reads mp_rank_*/model_optim_rng.pt only; 26.0.0 also forced torch
eval-interval: 25000
eval-iters: 0
log-timers-to-tensorboard: true
tensorboard-dir: ""           ## computed by pre-tasks
swanlab-project: ""           ## computed by pre-tasks
swanlab-exp-name: ""          ## computed by pre-tasks
swanlab-save-dir: ""          ## computed by pre-tasks
swanlab-mode: ""              ## online | local | offline | disabled; defaults to offline
distributed-backend: nccl
log-throughput: true
load: ""                      ## computed by pre-tasks
save: ""                      ## computed by pre-tasks
